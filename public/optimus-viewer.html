<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimus Anchor Viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1c22; overflow: hidden; }
    #c { width: 100vw; height: 100vh; display: block; }
    #ui { position: fixed; top: 8px; left: 8px; font: 12px monospace; color: #8af; background: rgba(0,0,0,.5); padding: 6px 8px; border-radius: 6px; z-index: 10; }
    #ui button { font: 12px monospace; margin: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="status">loading…</div>
    <button data-view="front">Front</button>
    <button data-view="three">3/4</button>
    <button data-view="side">Side</button>
    <button data-view="back">Back</button>
    <span id="bg"></span>
    <button data-bg="#1a1c22">Dark</button>
    <button data-bg="#e8e8ec">Light</button>
    <button data-bg="#2a2f3a">Studio</button>
  </div>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('c');
    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1c22');

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(0, 1.4, 4);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 1.0, 0);

    // Studio 3-point lighting
    const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(2.5, 4, 3); scene.add(key);
    const fill = new THREE.DirectionalLight(0xbfd0ff, 0.9); fill.position.set(-3, 2, 1.5); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(-1, 3, -4); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));

    let model = null, box = new THREE.Box3(), center = new THREE.Vector3(), size = new THREE.Vector3();
    const loader = new GLTFLoader();
    loader.load('/models/robot-optimus.glb', (gltf) => {
      model = gltf.scene;
      box.setFromObject(model);
      box.getCenter(center); box.getSize(size);
      // center on floor
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;
      scene.add(model);
      const h = size.y;
      controls.target.set(0, h * 0.55, 0);
      setView('three');
      status.textContent = `loaded  h=${h.toFixed(2)}m`;
    }, (e) => { status.textContent = `loading ${(e.loaded/1e6).toFixed(1)}MB`; },
       (err) => { status.textContent = 'ERROR ' + err; });

    function setView(v) {
      if (!model) return;
      const h = size.y, d = h * 1.6;
      const ty = h * 0.55;
      let pos;
      if (v === 'front') pos = [0, ty, d];
      else if (v === 'side') pos = [d, ty, 0];
      else if (v === 'back') pos = [0, ty, -d];
      else pos = [d * 0.7, ty, d * 0.75]; // three-quarter
      camera.position.set(...pos);
      controls.target.set(0, ty, 0);
      controls.update();
    }

    document.querySelectorAll('#ui [data-view]').forEach(b =>
      b.onclick = () => setView(b.dataset.view));
    document.querySelectorAll('#ui [data-bg]').forEach(b =>
      b.onclick = () => scene.background = new THREE.Color(b.dataset.bg));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
